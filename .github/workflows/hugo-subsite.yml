name: 重建 Hugo 子站

# 子站源在 hugo-src/，产物提交到仓库根目录的 zbgamelttwo/（Pages 从 main 根目录发布）。
# 2026-09-22 论坛整体下线后，这里是仓库里唯一的构建流水线。
#
# ⚠️ 两条必须记住的 GitHub 规则，改这里之前先读完：
#   1. 用仓库自带 GITHUB_TOKEN 推出去的提交，不会触发任何 workflow（递归防护）。
#   2. 本文件推送要重试、且三次都失败必须报错退出：以前循环最后跑的是 git pull，
#      推送失败会被误报成 success（2026-09-20 的事故就是这么静默过去的）。
on:
  push:
    branches: [main]
    paths:
      - 'hugo-src/**'
      - '.github/workflows/hugo-subsite.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hugo-subsite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Hugo extended
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: 构建子站
        run: |
          cd hugo-src
          hugo --gc --minify --destination ../zbgamelttwo

      - name: 提交生成结果
        run: |
          git config user.name  "zbgamelt"
          git config user.email "297119334+zbgamelt@users.noreply.github.com"
          git add -A zbgamelttwo
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(subsite): 重建 zbgamelttwo"
          # 论坛 workflow 可能同时在推 main，冲突就 rebase 重试。
          # 三次都失败必须 exit 1：否则最后一条 git pull 成功会把失败掩盖成 success。
          for i in 1 2 3; do
            if git push; then
              echo "✓ 已推送"
              exit 0
            fi
            echo "push 被拒，第 $i 次 rebase 重试"
            git pull --rebase --autostash origin main
          done
          echo "::error::push 重试 3 次仍被拒"
          exit 1

