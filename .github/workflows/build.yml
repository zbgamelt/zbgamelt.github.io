name: 重建静态论坛

# 帖子在 GitHub Discussions 里；这里只负责把它渲染成静态页面。
# GITHUB_TOKEN 的推送不会再次触发本 workflow，所以不会自己套自己。
#
# ⚠️ 2026-09-20 踩过的坑（主站线上 404 近一小时），改这里之前先读完：
#   同一次 push 会同时唤起本文件与 hugo-subsite.yml，两边都要往 main 推提交。
#   那次本 workflow 的“生成静态页面”是成功的，坏在“提交生成结果”的裸 git push
#   被 hugo 线抢推拒掉 → 整条 workflow 失败。之后不会自愈：抢推方是用 GITHUB_TOKEN
#   推的，按 GitHub 的递归防护不会再触发任何 workflow，只能等下一个 cron
#   （2 小时级，且 GitHub 定时任务会排队延迟）。
#   所以这里有两道保险，二者缺一都不够：
#     ① 本文件推送必须 rebase 重试，失败要报错（见“提交生成结果”）；
#     ② hugo-subsite.yml 收尾必须显式 dispatch 本 workflow（见那个文件的最后一步）。
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/site.json'
      - 'data/app.json'
      - 'assets/**'
      - '.github/workflows/build.yml'
  discussion:
  discussion_comment:
  schedule:
    - cron: '17 */2 * * *'   # 兜底：每 2 小时同步一次（GitHub 排队会晚，只能兜底，别当准时闹钟）
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: build-forum
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 发布闸门：build.mjs 会自检产物里每一段内联 <script> 能否被 JS 解析器解析，
      # 语法坏了就非 0 退出，后面的「提交生成结果」不会执行，坏页面进不了 main。
      - name: 生成静态页面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build.mjs

      - name: 提交生成结果
        run: |
          git config user.name  "zbgamelt"
          git config user.email "297119334+zbgamelt@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(site): 同步 Discussions 内容"
          # hugo 线可能同时在推 main；抢推被拒就 rebase 重试。
          # 以前这里只有一句裸 git push，被拒一次就整条 workflow 失败，产物停在旧提交。
          for i in 1 2 3; do
            if git push; then
              echo "✓ 产物已推送"
              exit 0
            fi
            echo "push 被拒，第 $i 次 rebase 重试"
            git pull --rebase --autostash origin main
          done
          echo "::error::push 重试 3 次仍被拒，本次产物没有推上去"
          exit 1
