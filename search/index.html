<body class="page-search">

<main id="main" class="wrap">
  <div class="sbar">
    <a class="sbar__back" href="../" id="sback" aria-label="返回" title="返回"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7.78 2.22 2 8l5.78 5.78 1.06-1.06L4.62 8.5H14v-1.5H4.62l4.22-4.22z"/></svg></a>
    <input id="sq" class="sbar__input" type="search" placeholder="搜索帖子…" autocomplete="off" aria-label="搜索帖子">
    <button id="sgo" class="sbar__go" type="button" aria-label="搜索" title="搜索"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.92-.62 6 6 0 1 1 8.54 0l3.03 3.03-1.06 1.06zM9.11 4.5a4 4 0 1 0-5.66 5.66 4 4 0 0 0 5.66-5.66z"/></svg></button>
  </div>
  <p class="scount" id="scount">帖子 0</p>
  <div class="slist" id="slist"></div>
  <p class="sempty" id="sempty" hidden>没有匹配的帖子，换个词试试？</p>
</main>
<script>
(function () {
  var POSTS = [{"n":42,"t":"V6.6 测试版反馈集中帖（有问题都发这里）","x":"V6.6 测试版已经放出来了，这一个月里大家报的问题我们都会在这个帖子里跟进。 报问题时请带上这三样，定位会快很多： 手机型号 + 系统版本 能重现的操作步骤 截图或录屏（有的话最好）…","s":"v6.6 测试版已经放出来了，这一个月里大家报的问题我们都会在这个帖子里跟进。 报问题时请带上这三样，定位会快很多： 手机型号 + 系统版本 能重现的操作步骤 截图或录屏（有的话最好） 已知问题会更新在下面的清单里，修好了会标记已解决。","u":"阿黄"},{"n":41,"t":"直播间左下角的点赞数到底是怎么算的？","x":"看直播的时候盯着点赞数看了半天，感觉它不是固定每秒涨几个，像是跟在线人数有关系。 有没有人知道具体规则？还是说纯随机？","s":"看直播的时候盯着点赞数看了半天，感觉它不是固定每秒涨几个，像是跟在线人数有关系。 有没有人知道具体规则？还是说纯随机？","u":"newbie-live"},{"n":40,"t":"建议：成就系统加一个「总进度」显示","x":"现在每一族成就要点进去才知道差多少，想知道自己离「全解锁」还差多远得挨个翻。 能不能在成就页顶部放一行总进度，比如 23 / 48 这种？","s":"现在每一族成就要点进去才知道差多少，想知道自己离「全解锁」还差多远得挨个翻。 能不能在成就页顶部放一行总进度，比如 23 / 48 这种？","u":"collector-w"},{"n":39,"t":"[反馈] WiFi 切 4G 之后，私信偶尔要等十来秒才重连","x":"现象：在家里用 WiFi 发私信正常，出门切到 4G 之后再发，有时候要等十几秒才收到回信，中间也没有任何提示。 切回 WiFi 又立刻好了。试了三次，两次能重现。","s":"现象：在家里用 wifi 发私信正常，出门切到 4g 之后再发，有时候要等十几秒才收到回信，中间也没有任何提示。 切回 wifi 又立刻好了。试了三次，两次能重现。","u":"night-walker"},{"n":38,"t":"新人报道，顺便问问有没有公会收人","x":"昨天刚下的游戏，玩了两小时，感觉直播那部分挺有意思的。 想找个活跃点的公会一起玩，有推荐吗？","s":"昨天刚下的游戏，玩了两小时，感觉直播那部分挺有意思的。 想找个活跃点的公会一起玩，有推荐吗？","u":"newbie-live"}];
  var q = document.getElementById('sq');
  var list = document.getElementById('slist');
  var count = document.getElementById('scount');
  var empty = document.getElementById('sempty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var hit = POSTS.filter(function (p) {
      if (!terms.length) return true;
      var hay = (p.t + ' ' + p.x + ' ' + p.s + ' ' + p.u).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    });
    count.textContent = '帖子 ' + hit.length;
    empty.hidden = hit.length > 0;
    list.innerHTML = hit
      .map(function (p) {
        return (
          '<a class="sitem" href="../t/' + p.n + '/">' +
          '<h2 class="sitem__title">' + esc(p.t) + '</h2>' +
          (p.x ? '<p class="sitem__excerpt">' + esc(p.x) + '</p>' : '') +
          '<div class="sitem__user">' + esc(p.u) + '</div>' +
          '</a>'
        );
      })
      .join('');
  }

  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); q.blur(); }
  });
  document.getElementById('sgo').addEventListener('click', function () { render(); q.focus(); });
  // 从站内点进来的才走浏览器返回；直接打开这个地址的就回首页
  document.getElementById('sback').addEventListener('click', function (e) {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    } catch (err) {}
  });
  render();
  q.focus();
})();
</script>
</body>
</html>
