baseURL = "https://zbgamelt.github.io/zbgamelttwo/"
title = "ZBGAME LT"
theme = "PaperMod"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
enableEmoji = true

# 首页要出 JSON 才能用主题自带搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    noClasses = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  env = "production"
  description = "轻量、干净的静态站点。写点东西，慢慢更新。"
  author = "zbgamelt"
  mainSections = ["posts"]

  # 只用深色，不给切换（用户偏好近黑 + 黄色强调）
  defaultTheme = "dark"
  disableThemeToggle = true

  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  # 打开评论：挂的是 assets/zsocial.js（本站账号，不需要 GitHub）
  comments = true
  ShowFullTextinRSS = false
  hideFooter = false

  [params.homeInfoParams]
    Title = "ZBGAME LT"
    Content = "轻量、干净的静态站点。写点东西，慢慢更新。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zbgamelt"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[[menus.main]]
  name = "首页"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "搜索"
  pageRef = "/search"
  weight = 30

[[menus.main]]
  name = "关于"
  pageRef = "/about"
  weight = 40
