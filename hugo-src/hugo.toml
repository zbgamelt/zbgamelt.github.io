baseURL = "https://zbgamelt.github.io/zbgamelttwo/"
title = "ZBGAME LT"
theme = "PaperMod"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
enableEmoji = true

# 首页要出 JSON 才能用主题自带搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    noClasses = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  env = "production"
  description = "轻量、干净的静态站点。写点东西，慢慢更新。"
  author = "zbgamelt"
  mainSections = ["posts"]

  # 只用深色，不给切换（用户偏好近黑 + 黄色强调）
  defaultTheme = "dark"
  disableThemeToggle = true

  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
    # 评论区已下线（2026-09-22）：论坛和后端一起删掉了。
    # 原先是 assets/zsocial.js 挂 Cloudflare Worker（站内邮箱账号），现在一并撤销。
    comments = false
  ShowFullTextinRSS = false
  hideFooter = false

  # ⚠️ 这张子表必须放在 [params] 里**所有普通配置之后**。
  #    TOML 里 [params.assets] 一旦开张，后面所有裸键（defaultTheme、comments 这种）
  #    都会挂到 params.assets 名下，而不是 params —— 曾经就因为把这张表插在中间，
  #    comments = true 变成了 params.assets.comments，主题判定 .Param "comments" 为假，
  #    整块评论区（连带里面的登录/注册）直接从博客上消失，页面还不报错。
  #    以后加配置请加在上面那堆里，别再往中间插表。
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/assets/icons/apple-touch-icon.png"
    theme_color = "#0b0c0e"
    # 这个在子站自己的 static/ 里，相对路径即可
    safari_pinned_tab = "safari-pinned-tab.svg"

  [params.homeInfoParams]
    Title = "ZBGAME LT"
    Content = "轻量、干净的静态站点。写点东西，慢慢更新。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zbgamelt"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[[menus.main]]
  name = "首页"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "搜索"
  pageRef = "/search"
  weight = 30

[[menus.main]]
  name = "关于"
  pageRef = "/about"
  weight = 40

# App 下载入口（APK 在 GitHub Pages 上，不在服务器域名里）
[[menus.main]]
  name = "App"
  url = "https://zbgamelt.github.io/app/"
  weight = 50

# 发帖/登录/注册在论坛那边做（同一个账号、同一个源），博客导航上也留个入口，
# 免得从博客进来的读者找不到这些功能。
[[menus.main]]
  name = "发帖"
  url = "https://zbgamelt.github.io/post/"
  weight = 60
