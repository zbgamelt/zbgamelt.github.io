<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>登录 — 主播模拟器mod</title>
<meta name="description" content="用邮箱账号登录">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="登录 — 主播模拟器mod">
<meta property="og:description" content="用邮箱账号登录">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230b0c0e%22%2F%3E%3Cpath%20d%3D%22M8%2010.5h16v9a2%202%200%200%201-2%202h-8l-4.5%203.5V21.5H10a2%202%200%200%201-2-2z%22%20fill%3D%22%23ffd83d%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="page-auth has-nav">
<a class="skip" href="#main">跳到内容</a>
<main id="main" class="wrap">
  <section class="auth">
    <h1 class="auth__t">用邮箱登录</h1>
    <p class="auth__sub">还没有账号？<a href="../register/">去注册一个</a>（不需要 GitHub）。</p>
    <div class="form">
      <label class="field"><span>邮箱</span><input id="e" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label class="field"><span>密码</span><input id="p" type="password" autocomplete="current-password" placeholder="你的密码"></label>
      <button class="btn" id="go" type="button">登录</button>
      <a class="btn btn--ghost" href="../me/">改用 GitHub 登录</a>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
  </section>
</main>
<nav class="bnav" aria-label="主导航">
  <a class="bnav__item" href="../"><svg viewBox="0 0 16 16" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M8 1.3 1.6 6.8V15h4.5v-4.4h3.8V15h4.5V6.8z"/></svg><span>首页</span></a>
  <a class="bnav__item is-on" href="../me/" aria-current="page"><svg viewBox="0 0 16 16" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M8 8.3a3.65 3.65 0 1 0 0-7.3 3.65 3.65 0 0 0 0 7.3m0 1.5c-3.2 0-5.8 1.7-5.8 3.8V15h11.6v-1.4c0-2.1-2.6-3.8-5.8-3.8"/></svg><span>我的</span></a>
</nav>
<script src="../assets/zsocial.js"></script>
<script>
(function () {
  var note = document.getElementById('note');
  var go = document.getElementById('go');
  var back = new URLSearchParams(location.search).get('return') || '/me/';
  if (back.charAt(0) !== '/') back = '/me/';
  function submit() {
    note.textContent = '';
    go.disabled = true;
    ZB.login(document.getElementById('e').value.trim(), document.getElementById('p').value)
      .then(function () { location.href = back; }, function (err) {
        note.textContent = err.message;
        go.disabled = false;
      });
  }
  go.addEventListener('click', submit);
  document.getElementById('p').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
